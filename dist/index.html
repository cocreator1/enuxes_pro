<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>eNuxes · Commerce for every business</title>
<style>
:root{font:14px Inter,system-ui,sans-serif;color:#172441;background:#f5f7fc;--blue:#244ce0;--border:#e0e6f0}*{box-sizing:border-box}body{margin:0}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:4px}button{cursor:pointer}header{background:white;border-bottom:1px solid var(--border)}nav,main,footer{max-width:1240px;margin:auto;padding:0 32px}nav{min-height:72px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}.brand{font-size:24px;letter-spacing:-1px;font-weight:850}.brand span{color:var(--blue)}.spacer{flex:1}.button,button{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border:1px solid var(--border);border-radius:9px;background:white;color:#182541;font-weight:650}.primary{background:var(--blue);color:white;border-color:var(--blue)}main{padding-top:24px;padding-bottom:54px}.crumb,small,.muted{color:#556481}.hero{margin:16px 0 28px;border-radius:20px;min-height:278px;padding:40px;display:flex;align-items:center;position:relative;overflow:hidden;background:linear-gradient(110deg,#132c8f,#294fe1);color:white}.hero section{position:relative;z-index:1}.hero h1{font-size:clamp(37px,6vw,68px);line-height:1;letter-spacing:-.055em;margin:16px 0}.hero p{color:#e4eaff}.hero-art{position:absolute;right:2%;width:48%;height:120%;top:-10%;display:grid;place-items:center;transform:rotate(-12deg);opacity:.88}.hero-art svg{width:74%;max-height:100%;filter:drop-shadow(0 22px 18px #0e217e80)}.badge{display:inline-block;border-radius:30px;background:#ffdf86;color:#4f3300;padding:5px 10px;font-weight:750;font-size:12px}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 16px}h2{letter-spacing:-.025em;font-size:25px;margin:0 0 12px}.active{background:#e8eeff;border-color:#b5c5ff;color:#1937a5}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card,.panel{background:white;border:1px solid var(--border);border-radius:14px;overflow:hidden}.art{height:186px;display:grid;place-items:center;position:relative}.art svg{width:65%;height:80%;filter:drop-shadow(0 9px 8px #24365430)}.art img{width:100%;height:100%;object-fit:cover}.art .badge{position:absolute;top:12px;left:12px}.cardbody,.panel{padding:18px}.card h3{margin:5px 0 10px;font-size:16px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.price{font-size:17px;font-weight:800}del{color:#65728a;font-weight:400;font-size:13px}.search,input,select,textarea{border:1px solid var(--border);border-radius:8px;background:white;color:inherit;padding:10px 12px;max-width:100%}.search{min-width:230px}label{display:grid;gap:5px;font-weight:600}form{display:grid;gap:12px}dialog{border:1px solid var(--border);border-radius:16px;width:min(540px,94vw);max-height:90vh;padding:22px;color:inherit}dialog::backdrop{background:#111c3b70}.line{border-bottom:1px solid var(--border);padding:12px 0}.stack{display:grid;gap:14px}.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}.notice{padding:12px;border-radius:8px;background:#fff2ce;color:#5b430f}footer{padding-bottom:30px;color:#556481}fieldset{border:1px solid var(--border);border-radius:8px}fieldset label{display:flex;align-items:center;gap:8px;margin:5px}#toast{position:fixed;bottom:18px;right:18px;background:#152753;color:white;padding:12px 18px;border-radius:9px;z-index:5}#toast:empty{display:none}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}nav,main,footer{padding-inline:16px}.hero{padding:25px}.split{grid-template-columns:1fr}}@media(max-width:450px){nav{gap:8px;padding-block:8px}.grid{gap:8px}.art{height:120px}.cardbody{padding:10px}.hero-art{opacity:.38}.search{width:100%}}
.admin-layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:24px;align-items:start}.admin-sidebar{display:grid;gap:10px}.admin-sections{display:grid;gap:6px}.admin-sections button{justify-content:flex-start}.admin-metric{display:grid;justify-content:start;text-align:left;gap:8px}.admin-metric strong{font-size:26px}.admin-layout h2{margin-bottom:0}@media(max-width:760px){.admin-layout{grid-template-columns:1fr}.admin-sections{display:flex;flex-wrap:wrap}}

.main-admin{--blue:#ac3c0a;--border:#d7dde1;background:#edf0f2;color:#28343d}
.main-admin header{background:#fff}
.main-admin .panel,.main-admin dialog{background:#fff}
.main-admin .admin-sidebar{background:#37444d;border-color:#37444d;color:#fff}
.main-admin .admin-sidebar small{color:#d9e3e9}
.main-admin .admin-sections button{background:transparent;border-color:transparent;color:#fff}
.main-admin .admin-sections button.active,.main-admin .admin-sections button:hover{background:#d9edf9;border-color:#bfd9e9;color:#23465c}
.main-admin .admin-metric:hover{background:#eaf5fb;border-color:#b9d7e8}
.main-admin .primary:hover{background:#923308;border-color:#923308}
.main-admin .badge{background:#d9edf9;color:#23465c}
.main-admin .notice{background:#fff0e5;color:#74310d}
.main-admin button:focus-visible,.main-admin input:focus-visible,.main-admin select:focus-visible,.main-admin a:focus-visible{outline:3px solid #537f9c}
.store-ad{margin:0 0 26px;padding:12px}.store-ad img{display:block;width:100%;max-height:240px;object-fit:contain;border-radius:8px}.store-ad small{display:block;margin-bottom:6px}
</style></head><body><header><nav id="nav"></nav></header><main id="app"></main><footer>eNuxes · Commerce & hospitality <span class="muted"> / Demo workspace</span></footer><dialog id="modal"></dialog><div id="toast" role="status"></div>
<script>
'use strict';
if (/^\/mainadmin-pro\/?$/.test(location.pathname)) document.body.classList.add('main-admin');
const types=['RESTAURANT','CAFE','BAR','HOTEL','ONLINE_STORE','RETAIL','OTHER'];
const colors=['#dce5ff','#e8e7f2','#e9dfd1','#dde8e7'];
const paths={
 shirt:'M61 34 84 22q16 18 32 0l23 12 33 26-24 32-18-12v74H70V80L52 92 28 60z',
 jeans:'M64 22h72l13 132h-31l-18-87-18 87H51z',
 bag:'M50 59h100l10 91H40z M76 63V47a24 24 0 0 1 48 0v16',
 cap:'M45 101a55 55 0 0 1 109 0l-10 10c42 6 47 20 19 22-33 3-64-4-86-18z',
 bowl:'M28 82h144a72 65 0 0 1-144 0z M56 65q-15-13 0-28m44 28q-15-13 0-28m44 28q-15-13 0-28'
};

const db={products:[]};
let business;
let storeBanner = null;
function bannerHtml() {
  const ad = storeBanner;
  if (!ad || !/^https:\/\//i.test(ad.image_url)) return '';
  const image = '<img loading="lazy" src="' + esc(ad.image_url) + '" alt="' + esc(ad.title || 'Sponsored advertisement') + '">';
  return '<aside class="panel store-ad"><small>Sponsored</small>'
    + (/^https:\/\//i.test(ad.destination_url) ? '<a href="' + esc(ad.destination_url) + '" rel="sponsored noreferrer">' + image + '</a>' : image)
    + '</aside>';
}

let category='',query='';
const app=document.getElementById('app'), modal=document.getElementById('modal'), nav=document.getElementById('nav');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'N$'+new Intl.NumberFormat('en-NA',{maximumFractionDigits:2}).format(n);
const price=p=>p.sale||p.price;
const getProduct=id=>db.products.find(p=>p.id===id&&p.businessId===business.id);
const icon=(art,color='#182849')=>'<svg viewBox="0 0 200 175" aria-hidden="true"><path d="'+(paths[art]||paths.bag)+'" fill="'+color+'" stroke="#fff7" stroke-width="2" stroke-linejoin="round" fill-rule="evenodd"/></svg>';
function toast(message){const box=document.getElementById('toast');box.textContent=message;clearTimeout(toast.timer);toast.timer=setTimeout(()=>box.textContent='',3000)}
function openDialog(title,body){modal.innerHTML='<div class="row"><h2>'+esc(title)+'</h2><button data-action="close" aria-label="Close">✕</button></div>'+body;if(!modal.open)modal.showModal()}
function card(p,i){return '<article class="card"><div class="art" style="background:'+colors[i%4]+'">'+(p.image?'<img src="'+esc(p.image)+'" alt="'+esc(p.name)+'">':icon(p.art,['#1e2945','#42608a','#a9784d','#273a55'][i%4]))+(p.sale?'<span class="badge">Special</span>':'')+'</div><div class="cardbody"><small>'+esc(p.category)+'</small><h3>'+esc(p.name)+'</h3><div class="row"><span class="price">'+money(price(p))+(p.sale?' <del>'+money(p.price)+'</del>':'')+'</span><button aria-label="View '+esc(p.name)+'" data-action="product" data-id="'+p.id+'">View ↗</button></div></div></article>'}
function filter(){document.getElementById('products').innerHTML=db.products.filter(p=>p.businessId===business.id&&p.active&&(!category||p.category===category)&&[p.name,p.category,p.description].join(' ').toLowerCase().includes(query.toLowerCase())).map(card).join('')||'<p>No matching items.</p>'}
function storefront(){const categories=[...new Set(db.products.filter(p=>p.businessId===business.id&&p.active).map(p=>p.category))];app.innerHTML='<div class="crumb">Businesses / '+esc(business.name)+'</div><div class="hero"><section><span class="badge">'+(business.type==='RESTAURANT'?'MENU':'ONLINE STORE')+'</span><h1>'+esc(business.name)+'</h1><p>'+esc(business.description)+'</p><a class="button" href="#browse">'+(business.type==='RESTAURANT'?'Browse menu':'Shop collection')+' ↓</a></section><div class="hero-art">'+icon(business.type==='RESTAURANT'?'bowl':'bag','#bdd0ff')+'</div></div>'+bannerHtml()+'<div id="browse" class="row"><h2>'+(business.type==='RESTAURANT'?'Menu':'Shop products')+'</h2><input class="search" id="search" type="search" aria-label="Search products" placeholder="Search products" value="'+esc(query)+'"></div><div class="toolbar">'+['',...categories].map(c=>'<button class="'+(c===category?'active':'')+'" data-action="category" data-id="'+esc(c)+'">'+esc(c||'All products')+'</button>').join('')+'</div><div class="grid" id="products"></div>';filter()}
function product(id){const p=getProduct(id);if(!p?.active)return;openDialog(p.name,'<p>'+esc(p.description)+'</p><p class="price">'+money(price(p))+'</p>')}
document.addEventListener('click', event => {
  const control = event.target.closest('[data-action]');
  if (!control) return;
  const {action, id} = control.dataset;
  if (action === 'close') modal.close();
  if (action === 'category') { category = id; storefront(); }
  if (action === 'product') product(id);
});
document.addEventListener('input', event => {
  if (event.target.id === 'search') { query = event.target.value; filter(); }
});
</script><script src="/platform.js"></script></body></html>
