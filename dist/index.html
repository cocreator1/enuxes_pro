</style><link rel="stylesheet" href="/shop.css"></head><body><header><nav id="nav"></nav></header><main id="app"></main><footer>eNuxes · Commerce & hospitality <span class="muted"> / Demo workspace</span></footer><dialog id="modal"></dialog><div id="toast" role="status"></div>
<script>
'use strict';
if (/^\/mainadmin-pro\/?$/.test(location.pathname)) document.body.classList.add('main-admin');
const types=['RESTAURANT','CAFE','BAR','HOTEL','ONLINE_STORE','RETAIL','OTHER'];
const colors=['#dce5ff','#e8e7f2','#e9dfd1','#dde8e7'];
const paths={
 shirt:'M61 34 84 22q16 18 32 0l23 12 33 26-24 32-18-12v74H70V80L52 92 28 60z',
 jeans:'M64 22h72l13 132h-31l-18-87-18 87H51z',
 bag:'M50 59h100l10 91H40z M76 63V47a24 24 0 0 1 48 0v16',
 cap:'M45 101a55 55 0 0 1 109 0l-10 10c42 6 47 20 19 22-33 3-64-4-86-18z',
 bowl:'M28 82h144a72 65 0 0 1-144 0z M56 65q-15-13 0-28m44 28q-15-13 0-28m44 28q-15-13 0-28'
};

const db={products:[]};
let business;
let storeBanner = null;
function bannerHtml() {
  const ad = storeBanner;
  if (!ad || !/^https:\/\//i.test(ad.image_url)) return '';
  const image = '<img loading="lazy" src="' + esc(ad.image_url) + '" alt="' + esc(ad.title || 'Sponsored advertisement') + '">';
  return '<aside class="panel store-ad"><small>Sponsored</small>'
    + (/^https:\/\//i.test(ad.destination_url) ? '<a href="' + esc(ad.destination_url) + '" rel="sponsored noreferrer">' + image + '</a>' : image)
    + '</aside>';
}

let category='',query='';
const app=document.getElementById('app'), modal=document.getElementById('modal'), nav=document.getElementById('nav');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'N$'+new Intl.NumberFormat('en-NA',{maximumFractionDigits:2}).format(n);
const price=p=>p.sale||p.price;
const getProduct=id=>db.products.find(p=>p.id===id&&p.businessId===business.id);
const icon=(art,color='#182849')=>'<svg viewBox="0 0 200 175" aria-hidden="true"><path d="'+(paths[art]||paths.bag)+'" fill="'+color+'" stroke="#fff7" stroke-width="2" stroke-linejoin="round" fill-rule="evenodd"/></svg>';
function toast(message){const box=document.getElementById('toast');box.textContent=message;clearTimeout(toast.timer);toast.timer=setTimeout(()=>box.textContent='',3000)}
function openDialog(title,body){modal.innerHTML='<div class="row"><h2>'+esc(title)+'</h2><button data-action="close" aria-label="Close">✕</button></div>'+body;if(!modal.open)modal.showModal()}
function card(p,i){return '<article class="card"><div class="art" style="background:'+colors[i%4]+'">'+(p.image?'<img src="'+esc(p.image)+'" alt="'+esc(p.name)+'">':icon(p.art,['#1e2945','#42608a','#a9784d','#273a55'][i%4]))+(p.sale?'<span class="badge">Special</span>':'')+'</div><div class="cardbody"><small>'+esc(p.category)+'</small><h3>'+esc(p.name)+'</h3><div class="row"><span class="price">'+money(price(p))+(p.sale?' <del>'+money(p.price)+'</del>':'')+'</span><button aria-label="View '+esc(p.name)+'" data-action="product" data-id="'+p.id+'">View ↗</button></div></div></article>'}
function filter(){document.getElementById('products').innerHTML=db.products.filter(p=>p.businessId===business.id&&p.active&&(!category||p.category===category)&&[p.name,p.category,p.description].join(' ').toLowerCase().includes(query.toLowerCase())).map(card).join('')||'<p>No matching items.</p>'}
function storefront(){const categories=[...new Set(db.products.filter(p=>p.businessId===business.id&&p.active).map(p=>p.category))];app.innerHTML='<div class="crumb">Businesses / '+esc(business.name)+'</div><div class="hero"><section><span class="badge">'+(business.type==='RESTAURANT'?'MENU':'ONLINE STORE')+'</span><h1>'+esc(business.name)+'</h1><p>'+esc(business.description)+'</p><a class="button" href="#browse">'+(business.type==='RESTAURANT'?'Browse menu':'Shop collection')+' ↓</a></section><div class="hero-art">'+icon(business.type==='RESTAURANT'?'bowl':'bag','#bdd0ff')+'</div></div>'+bannerHtml()+'<div id="browse" class="row"><h2>'+(business.type==='RESTAURANT'?'Menu':'Shop products')+'</h2><input class="search" id="search" type="search" aria-label="Search products" placeholder="Search products" value="'+esc(query)+'"></div><div class="toolbar">'+['',...categories].map(c=>'<button class="'+(c===category?'active':'')+'" data-action="category" data-id="'+esc(c)+'">'+esc(c||'All products')+'</button>').join('')+'</div><div class="grid" id="products"></div>';filter();renderPublishedLayout()}
function product(id){const p=getProduct(id);if(!p?.active)return;openDialog(p.name,'<p>'+esc(p.description)+'</p><p class="price">'+money(price(p))+'</p>')}
document.addEventListener('click', event => {
  const control = event.target.closest('[data-action]');
  if (!control) return;
  const {action, id} = control.dataset;
  if (action === 'close') modal.close();
  if (action === 'category') { category = id; storefront(); }
  if (action === 'product') product(id);
});
document.addEventListener('input', event => {
  if (event.target.id === 'search') { query = event.target.value; filter(); }
});
</script><script src="/builder.js"></script><script src="/shop.js"></script><script src="/marketplace.js"></script><script src="/home-layout.js"></script><script src="/draft.js"></script><script src="/platform.js"></script></body></html>
