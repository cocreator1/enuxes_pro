<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>eNuxes · Commerce for every business</title>
<style>
:root{font:14px Inter,system-ui,sans-serif;color:#172441;background:#f5f7fc;--blue:#244ce0;--border:#e0e6f0}*{box-sizing:border-box}body{margin:0}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:4px}button{cursor:pointer}header{background:white;border-bottom:1px solid var(--border)}nav,main,footer{max-width:1240px;margin:auto;padding:0 32px}nav{min-height:72px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}.brand{font-size:24px;letter-spacing:-1px;font-weight:850}.brand span{color:var(--blue)}.spacer{flex:1}.button,button{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border:1px solid var(--border);border-radius:9px;background:white;color:#182541;font-weight:650}.primary{background:var(--blue);color:white;border-color:var(--blue)}main{padding-top:24px;padding-bottom:54px}.crumb,small,.muted{color:#556481}.hero{margin:16px 0 28px;border-radius:20px;min-height:278px;padding:40px;display:flex;align-items:center;position:relative;overflow:hidden;background:linear-gradient(110deg,#132c8f,#294fe1);color:white}.hero section{position:relative;z-index:1}.hero h1{font-size:clamp(37px,6vw,68px);line-height:1;letter-spacing:-.055em;margin:16px 0}.hero p{color:#e4eaff}.hero-art{position:absolute;right:2%;width:48%;height:120%;top:-10%;display:grid;place-items:center;transform:rotate(-12deg);opacity:.88}.hero-art svg{width:74%;max-height:100%;filter:drop-shadow(0 22px 18px #0e217e80)}.badge{display:inline-block;border-radius:30px;background:#ffdf86;color:#4f3300;padding:5px 10px;font-weight:750;font-size:12px}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 16px}h2{letter-spacing:-.025em;font-size:25px;margin:0 0 12px}.active{background:#e8eeff;border-color:#b5c5ff;color:#1937a5}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card,.panel{background:white;border:1px solid var(--border);border-radius:14px;overflow:hidden}.art{height:186px;display:grid;place-items:center;position:relative}.art svg{width:65%;height:80%;filter:drop-shadow(0 9px 8px #24365430)}.art img{width:100%;height:100%;object-fit:cover}.art .badge{position:absolute;top:12px;left:12px}.cardbody,.panel{padding:18px}.card h3{margin:5px 0 10px;font-size:16px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.price{font-size:17px;font-weight:800}del{color:#65728a;font-weight:400;font-size:13px}.search,input,select,textarea{border:1px solid var(--border);border-radius:8px;background:white;color:inherit;padding:10px 12px;max-width:100%}.search{min-width:230px}label{display:grid;gap:5px;font-weight:600}form{display:grid;gap:12px}dialog{border:1px solid var(--border);border-radius:16px;width:min(540px,94vw);max-height:90vh;padding:22px;color:inherit}dialog::backdrop{background:#111c3b70}.line{border-bottom:1px solid var(--border);padding:12px 0}.stack{display:grid;gap:14px}.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}.notice{padding:12px;border-radius:8px;background:#fff2ce;color:#5b430f}footer{padding-bottom:30px;color:#556481}fieldset{border:1px solid var(--border);border-radius:8px}fieldset label{display:flex;align-items:center;gap:8px;margin:5px}#toast{position:fixed;bottom:18px;right:18px;background:#152753;color:white;padding:12px 18px;border-radius:9px;z-index:5}#toast:empty{display:none}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}nav,main,footer{padding-inline:16px}.hero{padding:25px}.split{grid-template-columns:1fr}}@media(max-width:450px){nav{gap:8px;padding-block:8px}.grid{gap:8px}.art{height:120px}.cardbody{padding:10px}.hero-art{opacity:.38}.search{width:100%}}
</style></head><body><header><nav id="nav"></nav></header><main id="app"></main><footer>eNuxes · Commerce & hospitality <span class="muted"> / Demo workspace</span></footer><dialog id="modal"></dialog><div id="toast" role="status"></div>
<script>
'use strict';
const types=['RESTAURANT','CAFE','BAR','HOTEL','ONLINE_STORE','RETAIL','OTHER'];
const methods={collection:'Pay on collection',card:'Card',wallet:'E-wallet'};
const states=['NEW','CONFIRMED','PROCESSING','READY FOR COLLECTION','OUT FOR DELIVERY','COMPLETED','CANCELLED'];
const colors=['#dce5ff','#e8e7f2','#e9dfd1','#dde8e7'];
const paths={
 shirt:'M61 34 84 22q16 18 32 0l23 12 33 26-24 32-18-12v74H70V80L52 92 28 60z',
 jeans:'M64 22h72l13 132h-31l-18-87-18 87H51z',
 bag:'M50 59h100l10 91H40z M76 63V47a24 24 0 0 1 48 0v16',
 cap:'M45 101a55 55 0 0 1 109 0l-10 10c42 6 47 20 19 22-33 3-64-4-86-18z',
 bowl:'M28 82h144a72 65 0 0 1-144 0z M56 65q-15-13 0-28m44 28q-15-13 0-28m44 28q-15-13 0-28'
};
const initial={businesses:[
 {id:'fashion',name:'Fashion Hub',slug:'fashionhub',type:'ONLINE_STORE',package:'Gold',active:true,collection:true,delivery:true,fee:60,payments:['collection'],description:'Everyday essentials, thoughtfully selected.'},
 {id:'sky',name:'Sky Bar',slug:'skybar',type:'RESTAURANT',package:'Gold',active:true,collection:true,delivery:false,fee:0,payments:['collection'],description:'Good food and easy evenings.'}
],products:[
 ['fashion','Classic Shirt','Clothing',499,399,'shirt','A clean-cut everyday staple.','S,M,L,XL','Black,White',12],
 ['fashion','Straight-Leg Jeans','Clothing',699,0,'jeans','Classic straight fit in mid-wash denim.','28,30,32,34','Blue',16],
 ['fashion','Everyday Tote','Accessories',299,0,'bag','A roomy carryall for your daily essentials.','','Sand,Black',null],
 ['fashion','Studio Cap','Accessories',249,199,'cap','An adjustable cap with a low-profile fit.','','Navy,White',9],
 ['sky','House Bowl','Mains',125,0,'bowl','Our house bowl with seasonal vegetables.','','',null]
].map(([businessId,name,category,price,sale,art,description,sizes,colours,stock],i)=>({id:'p'+i,businessId,name,category,price,sale,art,description,sizes,colours,stock,active:true,sku:'EN-'+(i+1)})),orders:[],carts:{}};
const key='enuxes-workspace-v1';
let db=JSON.parse(localStorage.getItem(key)||'null')||structuredClone(initial);
let category='',query='';
const save=()=>localStorage.setItem(key,JSON.stringify(db));
const path=location.pathname.split('/').filter(Boolean);
const business=db.businesses.find(b=>b.slug===path[0]);
const mode=path[0]==='platform'?'platform':path[1]==='admin'?'admin':'store';
const app=document.getElementById('app'), modal=document.getElementById('modal'), nav=document.getElementById('nav');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'N$'+new Intl.NumberFormat('en-NA',{maximumFractionDigits:2}).format(n);
const round=n=>Math.round(n*100)/100;
const price=p=>p.sale||p.price;
const getProduct=id=>db.products.find(p=>p.id===id&&p.businessId===business.id);
const cart=()=>db.carts[business.id]??=[];
const enabled=b=>b.payments.filter(m=>m==='collection');
const icon=(art,color='#182849')=>'<svg viewBox="0 0 200 175" aria-hidden="true"><path d="'+(paths[art]||paths.bag)+'" fill="'+color+'" stroke="#fff7" stroke-width="2" stroke-linejoin="round" fill-rule="evenodd"/></svg>';
function toast(message){const box=document.getElementById('toast');box.textContent=message;clearTimeout(toast.timer);toast.timer=setTimeout(()=>box.textContent='',3000)}
function openDialog(title,body){modal.innerHTML='<div class="row"><h2>'+esc(title)+'</h2><button data-action="close" aria-label="Close">✕</button></div>'+body;if(!modal.open)modal.showModal()}
function renderNav(){nav.innerHTML='<a class="brand" href="/"><span>e</span>Nuxes</a><a href="/">Businesses</a>'+(business?'<a href="/'+business.slug+'">'+esc(business.name)+'</a>':'')+'<span class="spacer"></span><a class="button" href="'+(business?'/'+business.slug+'/admin':'/platform')+'">'+(business?'Business admin':'Platform admin')+'</a>'+(business&&mode==='store'?'<button class="primary" data-action="cart">Cart · '+cart().reduce((n,l)=>n+l.quantity,0)+'</button>':'')}
function card(p,i){return '<article class="card"><div class="art" style="background:'+colors[i%4]+'">'+(p.image?'<img src="'+esc(p.image)+'" alt="'+esc(p.name)+'">':icon(p.art,['#1e2945','#42608a','#a9784d','#273a55'][i%4]))+(p.sale?'<span class="badge">Special</span>':'')+'</div><div class="cardbody"><small>'+esc(p.category)+'</small><h3>'+esc(p.name)+'</h3><div class="row"><span class="price">'+money(price(p))+(p.sale?' <del>'+money(p.price)+'</del>':'')+'</span><button aria-label="View '+esc(p.name)+'" data-action="product" data-id="'+p.id+'">View ↗</button></div></div></article>'}
function filter(){document.getElementById('products').innerHTML=db.products.filter(p=>p.businessId===business.id&&p.active&&(!category||p.category===category)&&[p.name,p.category,p.description].join(' ').toLowerCase().includes(query.toLowerCase())).map(card).join('')||'<p>No matching items.</p>'}
function storefront(){const categories=[...new Set(db.products.filter(p=>p.businessId===business.id&&p.active).map(p=>p.category))];app.innerHTML='<div class="crumb">Businesses / '+esc(business.name)+'</div><div class="hero"><section><span class="badge">'+(business.type==='RESTAURANT'?'MENU':'ONLINE STORE')+'</span><h1>'+esc(business.name)+'</h1><p>'+esc(business.description)+'</p><a class="button" href="#browse">'+(business.type==='RESTAURANT'?'Browse menu':'Shop collection')+' ↓</a></section><div class="hero-art">'+icon(business.type==='RESTAURANT'?'bowl':'bag','#bdd0ff')+'</div></div><div id="browse" class="row"><h2>'+(business.type==='RESTAURANT'?'Menu':'Shop products')+'</h2><input class="search" id="search" type="search" aria-label="Search products" placeholder="Search products" value="'+esc(query)+'"></div><div class="toolbar">'+['',...categories].map(c=>'<button class="'+(c===category?'active':'')+'" data-action="category" data-id="'+esc(c)+'">'+esc(c||'All products')+'</button>').join('')+'</div><div class="grid" id="products"></div>';filter()}
function directory(){app.innerHTML='<div class="hero"><section><span class="badge">THE BUSINESS DIRECTORY</span><h1>Shop local.</h1><p>Discover stores, restaurants and more on eNuxes.</p><a href="/fashionhub" class="button">Explore Fashion Hub ↗</a></section><div class="hero-art">'+icon('bag','#bdd0ff')+'</div></div><h2>Explore businesses</h2><div class="grid">'+db.businesses.filter(b=>b.active).map(b=>'<article class="panel"><small>'+esc(b.type.replaceAll('_',' '))+'</small><h3>'+esc(b.name)+'</h3><p>'+esc(b.description)+'</p><a class="button" href="/'+b.slug+'">Visit business ↗</a></article>').join('')+'</div>'}
function option(label,values){return values?'<label>'+label+'<select name="'+label+'">'+values.split(',').filter(Boolean).map(v=>'<option>'+esc(v.trim())+'</option>').join('')+'</select></label>':''}
function product(id){const p=getProduct(id);if(!p?.active)return;openDialog(p.name,'<p>'+esc(p.description)+'</p><p class="price">'+money(price(p))+'</p><form data-form="add" data-id="'+id+'">'+option('Size',p.sizes)+option('Colour',p.colours)+'<label>Quantity<input type="number" name="quantity" min="1" max="'+Math.min(99,p.stock??99)+'" value="1" required></label><button class="primary" '+(p.stock===0?'disabled':'')+'>'+(p.stock===0?'Sold out':'Add to cart')+'</button></form>')}
function subtotal(){return round(cart().reduce((s,l)=>s+(getProduct(l.id)?price(getProduct(l.id))*l.quantity:0),0))}
function showCart(){const rows=cart().map((l,i)=>{const p=getProduct(l.id);return '<div class="line row"><div><strong>'+esc(p?.name||'Unavailable item')+'</strong><br><small>'+esc([l.size,l.colour].filter(Boolean).join(' / '))+'</small></div><div class="row"><input data-quantity="'+i+'" aria-label="Quantity" type="number" min="1" max="99" value="'+l.quantity+'" style="width:67px"><button data-action="remove" data-id="'+i+'">Remove</button></div></div>'}).join('');openDialog('Your cart',rows?rows+'<p class="row"><strong>Subtotal</strong><strong>'+money(subtotal())+'</strong></p><button class="primary" data-action="checkout">Checkout</button>':'<p>Your cart is empty.</p>')}
function checkout(){openDialog('Checkout','<form data-form="order"><div class="split"><label>Name<input name="name" required maxlength="100" autocomplete="name"></label><label>Mobile<input name="mobile" type="tel" required maxlength="30" autocomplete="tel"></label></div><label>Fulfilment<select name="fulfilment" required>'+(business.collection?'<option value="collection">Collection</option>':'')+(business.delivery?'<option value="delivery">Delivery</option>':'')+'</select></label><label id="address" hidden>Delivery address<input name="address" maxlength="250"></label><label>Payment<select name="payment" required></select></label><label>Order notes (optional)<textarea name="notes" maxlength="400"></textarea></label><div id="totals"></div><button class="primary" id="place">Place demo order</button><small>Use sample customer details in this demo.</small></form>');updateCheckout()}
function updateCheckout(){const f=modal.querySelector('form');const delivery=f.elements.fulfilment.value==='delivery';const fee=delivery?business.fee:0;const options=delivery?[]:enabled(business);f.elements.payment.innerHTML=options.map(m=>'<option value="'+m+'">'+methods[m]+'</option>').join('');document.getElementById('address').style.display=delivery?'grid':'none';f.elements.address.required=delivery;document.getElementById('totals').innerHTML='<div class="row line"><span>Subtotal</span>'+money(subtotal())+'</div><div class="row line"><span>Fulfilment fee</span>'+money(fee)+'</div><div class="row line"><strong>Total</strong><strong>'+money(round(subtotal()+fee))+'</strong></div>'+(options.length?'':'<p class="notice">No payment method is available for this fulfilment option.</p>');document.getElementById('place').disabled=!options.length}
function admin(){const products=db.products.filter(p=>p.businessId===business.id);const orders=db.orders.filter(o=>o.businessId===business.id);app.innerHTML='<div class="stack"><div class="notice">Demo workspace · Data is stored in this browser. Use sample details.</div><div class="row"><div><small>BUSINESS ADMIN</small><h2>'+esc(business.name)+'</h2></div><a class="button" href="/'+business.slug+'">View storefront ↗</a></div><div class="grid"><div class="panel"><small>Orders</small><h2>'+orders.length+'</h2></div><div class="panel"><small>Paid revenue</small><h2>'+money(round(orders.filter(o=>o.paymentStatus==='PAID').reduce((s,o)=>s+o.total,0)))+'</h2></div><div class="panel"><small>Active products</small><h2>'+products.filter(p=>p.active).length+'</h2></div><div class="panel"><small>Low stock</small><h2>'+products.filter(p=>p.stock!==null&&p.stock<=3).length+'</h2></div></div><div class="panel"><div class="row"><h2>Products & inventory</h2><button class="primary" data-action="edit">Add product</button></div>'+products.map(p=>'<div class="line row"><div><strong>'+esc(p.name)+'</strong><br><small>'+esc(p.category)+' · '+esc(p.sku||'No SKU')+' · '+(p.stock??'Untracked')+(p.active?'':' · Inactive')+'</small></div><span>'+money(price(p))+'</span><button data-action="edit" data-id="'+p.id+'">Edit</button></div>').join('')+'</div><div class="panel"><h2>Orders</h2>'+(orders.map(o=>'<div class="line row"><div><strong>'+esc(o.id)+' · '+esc(o.name)+'</strong><br><small>'+esc(o.fulfilment)+' · '+esc(o.paymentStatus)+' · '+money(o.total)+'</small></div><button data-action="order-detail" data-id="'+o.id+'">View order</button><select aria-label="Order status" data-order="'+o.id+'">'+states.map(s=>'<option '+(s===o.status?'selected':'')+'>'+s+'</option>').join('')+'</select>'+(o.paymentStatus==='PAY_ON_COLLECTION'&&o.status!=='CANCELLED'?'<button data-action="paid" data-id="'+o.id+'">Record collection payment</button>':'')+'</div>').join('')||'<p class="muted">Orders appear here after checkout.</p>')+'</div><div class="panel"><h2>Business profile & payment settings</h2><form data-form="settings"><label>Business name<input name="name" required value="'+esc(business.name)+'"></label><label>Description<input name="description" value="'+esc(business.description)+'"></label><fieldset><legend>Payment methods</legend>'+Object.entries(methods).map(([k,v])=>'<label><input type="checkbox" name="payments" value="'+k+'" '+(business.payments.includes(k)?'checked ':'')+'>'+v+(k==='collection'?'':' · Requires provider setup')+'</label>').join('')+'</fieldset><fieldset><legend>Fulfilment</legend><label><input type="checkbox" name="collection" '+(business.collection?'checked':'')+'>Collection</label><label><input type="checkbox" name="delivery" '+(business.delivery?'checked':'')+'>Delivery</label></fieldset><label>Delivery fee (N$)<input name="fee" type="number" min="0" step=".01" required value="'+business.fee+'"></label><div><button class="primary">Save settings</button></div></form></div></div>'}
function edit(id){const p=id?getProduct(id):{};if(!p)return;const field=(label,name,type='text',attrs='')=>'<label>'+label+'<input name="'+name+'" type="'+type+'" value="'+esc(p[name])+'" '+attrs+'></label>';openDialog(id?'Edit product':'Add product','<form data-form="edit" data-id="'+(id||'')+'">'+field('Name','name','text','required')+field('Category','category','text','required')+field('Description','description')+'<div class="split">'+field('Price (N$)','price','number','required min=".01" step=".01"')+field('Sale price (N$)','sale','number','min="0" step=".01"')+field('Stock (blank if untracked)','stock','number','min="0" step="1"')+field('SKU','sku')+'</div>'+field('Sizes (comma separated)','sizes')+field('Colours (comma separated)','colours')+field('Image URL','image','url')+'<label>Or upload a product image<input name="upload" type="file" accept="image/png,image/jpeg,image/webp"></label><label>Availability<select name="active"><option value="yes">Active</option><option value="no" '+(p.active===false?'selected':'')+'>Inactive</option></select></label><button class="primary">Save product</button></form>')}
function platform(){app.innerHTML='<div class="stack"><div class="notice">Demo platform admin · Use sample business details.</div><div class="row"><h2>Businesses</h2><button class="primary" data-action="new-business">Create business</button></div>'+db.businesses.map(b=>'<div class="panel row"><div><strong>'+esc(b.name)+'</strong><br><small>'+esc(b.type)+' · '+esc(b.package)+' · '+(b.active?'Active':'Inactive')+'</small></div><a class="button" href="/'+b.slug+'">Public page</a><a class="button" href="/'+b.slug+'/admin">Manage</a></div>').join('')+'</div>'}
function newBusiness(){openDialog('Create business','<form data-form="business"><label>Business name<input name="name" required maxlength="100"></label><label>Slug<input name="slug" required pattern="[a-z0-9]+(-[a-z0-9]+)*" maxlength="50"></label><label>Type<select name="type">'+types.map(t=>'<option>'+t+'</option>').join('')+'</select></label><label>Package<select name="package"><option>Gold</option><option>Silver</option><option>Starter</option></select></label><label>Status<select name="active"><option value="yes">Active</option><option value="no">Inactive</option></select></label><button class="primary">Create business</button></form>')}
function render(){renderNav();if(mode==='platform')platform();else if(business&&mode==='admin')admin();else if(business?.active)storefront();else if(path.length)app.innerHTML='<h2>Business unavailable</h2><a href="/">Browse businesses</a>';else directory()}
function commit(){try{save()}catch{db=JSON.parse(localStorage.getItem(key)||'null')||structuredClone(initial);toast('Browser storage is full. Use a smaller image.');return false}return true}
document.addEventListener('click',e=>{const control=e.target.closest('[data-action]');if(!control)return;const {action,id}=control.dataset;switch(action){case 'close':modal.close();break;case 'category':category=id;storefront();break;case 'product':product(id);break;case 'cart':showCart();break;case 'remove':cart().splice(Number(id),1);if(commit()){renderNav();showCart()}break;case 'checkout':checkout();break;case 'edit':edit(id);break;case 'new-business':newBusiness();break;case 'order-detail':{const o=db.orders.find(x=>x.id===id&&x.businessId===business.id);if(o)openDialog(o.id,'<p>'+esc(o.name)+' · '+esc(o.mobile)+'</p>'+o.items.map(i=>'<div class="line">'+esc(i.name)+' × '+i.quantity+' '+esc([i.size,i.colour].filter(Boolean).join(' / '))+'</div>').join('')+'<p>'+esc(o.address||'Collection')+'</p><p>'+esc(o.notes)+'</p><strong>'+money(o.total)+'</strong>');break}case 'paid':{const o=db.orders.find(x=>x.id===id&&x.businessId===business.id);if(o?.paymentStatus==='PAY_ON_COLLECTION'&&o.status!=='CANCELLED'){o.paymentStatus='PAID';if(commit())admin()}break}}});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;filter()}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.quantity!==undefined){const line=cart()[Number(t.dataset.quantity)];if(line){line.quantity=Math.max(1,Math.min(99,Math.floor(Number(t.value)||1)));if(commit()){renderNav();showCart()}}}if(t.name==='fulfilment')updateCheckout();if(t.dataset.order){const o=db.orders.find(x=>x.id===t.dataset.order&&x.businessId===business.id);if(!o||o.status==='CANCELLED'||!states.includes(t.value)){admin();return}if(t.value==='CANCELLED'){if(o.paymentStatus==='PAID'){toast('Resolve the recorded payment before cancellation.');admin();return}for(const i of o.items){const p=getProduct(i.id);if(p&&p.stock!==null&&i.tracked)p.stock+=i.quantity}}o.status=t.value;if(commit())admin()}});
document.addEventListener('submit',async e=>{const f=e.target;if(!f.dataset.form)return;e.preventDefault();const fd=new FormData(f), v=Object.fromEntries(fd),id=f.dataset.id;switch(f.dataset.form){
 case 'add':{const p=getProduct(id),quantity=Number(v.quantity);if(!p?.active||!Number.isInteger(quantity)||quantity<1||cart().filter(l=>l.id===id).reduce((n,l)=>n+l.quantity,0)+quantity>(p.stock??99)){toast('Requested quantity is unavailable.');return}const line=cart().find(l=>l.id===id&&l.size===v.Size&&l.colour===v.Colour);if(line)line.quantity+=quantity;else cart().push({id,quantity,size:v.Size,colour:v.Colour});if(commit()){modal.close();renderNav();toast('Added to cart')}return}
 case 'order':{if(!cart().length||!business.active||!business.collection||v.fulfilment!=='collection'||!enabled(business).includes(v.payment)||!v.name.trim()||!v.mobile.trim()){toast('Check your checkout details.');return}const counts=new Map();const items=[];for(const l of cart()){const p=getProduct(l.id);const count=(counts.get(l.id)||0)+l.quantity;if(!p?.active||count>(p.stock??Infinity)||![p.sizes,p.colours].every((opts,i)=>!opts||opts.split(',').map(s=>s.trim()).includes(i?l.colour:l.size))){toast('An item or variation is unavailable. Update your cart.');return}counts.set(l.id,count);items.push({...l,name:p.name,price:price(p),tracked:p.stock!==null})}const total=subtotal();for(const [pId,count] of counts){const p=getProduct(pId);if(p.stock!==null)p.stock-=count}const order={id:'EN-'+crypto.randomUUID().slice(0,8).toUpperCase(),businessId:business.id,items,total,name:v.name.trim(),mobile:v.mobile.trim(),notes:v.notes,fulfilment:v.fulfilment,payment:v.payment,status:'NEW',paymentStatus:'PAY_ON_COLLECTION'};db.orders.unshift(order);db.carts[business.id]=[];if(commit()){renderNav();openDialog('Order placed','<p>Reference <strong>'+order.id+'</strong></p><p>'+money(total)+' · Pay on collection</p><button data-action="close">Continue shopping</button>')}return}
 case 'edit':{const sale=Number(v.sale), amount=Number(v.price);if(sale>=amount||!v.name.trim()||!v.category.trim()){toast('Enter a name, category and a sale price below the regular price.');return}const current=id?getProduct(id):null;let image=v.image;if(image&&!/^https:\/\//i.test(image)&&!/^data:image\/(png|jpeg|webp);base64,[a-z0-9+/=]+$/i.test(image)){toast('Use an HTTPS image URL.');return}if(v.upload.size){if(v.upload.size>500000||!['image/png','image/jpeg','image/webp'].includes(v.upload.type)){toast('Choose a PNG, JPG or WebP under 500 KB.');return}image=await new Promise(resolve=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>resolve('');reader.readAsDataURL(v.upload)})}const record={id:current?.id||crypto.randomUUID(),businessId:business.id,art:current?.art||'bag',name:v.name.trim(),category:v.category.trim(),description:v.description,price:amount,sale,stock:v.stock===''?null:Number(v.stock),sku:v.sku,sizes:v.sizes,colours:v.colours,image,active:v.active==='yes'};if(current)Object.assign(current,record);else db.products.push(record);break}
 case 'settings':Object.assign(business,{name:v.name.trim()||business.name,description:v.description,payments:fd.getAll('payments'),collection:fd.has('collection'),delivery:fd.has('delivery'),fee:Number(v.fee)});break;
 case 'business':{if(!v.name.trim()||['platform','admin-login','index-html'].includes(v.slug)||db.businesses.some(b=>b.slug===v.slug)){toast('Choose a name and a unique slug.');return}db.businesses.push({id:crypto.randomUUID(),name:v.name.trim(),type:v.type,slug:v.slug,package:v.package,active:v.active==='yes',description:'',collection:true,delivery:false,fee:0,payments:['collection']});break}
 }if(commit()){modal.close();render();toast('Saved')}});
render();
</script></body></html>
